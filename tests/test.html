<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>HKR — local test runner</title>
<style>
body{font-family:-apple-system,system-ui,sans-serif;background:#0f1117;color:#e8ecf4;
  max-width:720px;margin:40px auto;padding:0 20px}
h1{font-size:20px} .sub{color:#9aa5b8;font-size:13px;margin-bottom:20px}
.t{padding:8px 12px;border-radius:8px;margin:4px 0;font-size:13.5px;background:#161a23}
.pass{border-left:3px solid #4ade80}.fail{border-left:3px solid #f87171;color:#fca5a5;white-space:pre-wrap}
#summary{margin-top:16px;font-weight:700}
iframe{display:none}
</style>
</head>
<body>
<h1>🧪 Local test runner</h1>
<div class="sub">Runs the shared cases from <code>cases.json</code> against the live app's pure
functions (exposed via <code>?hkrtest</code>). Serve with <code>python3 tools/dev.py</code> and open
<code>http://localhost:8123/tests/test.html</code>. CI runs the same cases plus worker tests under node.</div>
<div id="results"></div>
<div id="summary"></div>
<iframe id="app" src="../index.html?hkrtest=1"></iframe>
<script>
const results=document.getElementById("results");
let pass=0, fail=0;
function report(name, ok, detail){
  const d=document.createElement("div");
  d.className="t "+(ok?"pass":"fail");
  d.textContent=(ok?"✓ ":"✗ ")+name+(ok?"":"\n"+detail);
  results.appendChild(d);
  ok?pass++:fail++;
}
function check(name, fn){
  try{ fn(); report(name,true); }
  catch(e){ report(name,false,String(e.message||e)); }
}
const eq=(a,b,msg)=>{ if(JSON.stringify(a)!==JSON.stringify(b))
  throw new Error(`${msg||"mismatch"}: got ${JSON.stringify(a)}, want ${JSON.stringify(b)}`); };
const resolve=(o,p)=>p.split(".").reduce((x,k)=>x==null?x:x[k],o);

window.addEventListener("load", async ()=>{
  // wait for the app iframe to expose the hook
  const app=document.getElementById("app");
  let T=null;
  for(let i=0;i<40 && !T;i++){
    T=app.contentWindow.HKR_TEST;
    if(!T) await new Promise(r=>setTimeout(r,150));
  }
  if(!T){ report("HKR_TEST hook available",false,"app never exposed window.HKR_TEST — is ?hkrtest wired?");
    document.getElementById("summary").textContent="✗ cannot run"; return; }
  report("HKR_TEST hook available",true);
  const cases=await (await fetch("cases.json")).json();

  for(const c of cases.mergeStores)
    check("mergeStores: "+c.name, ()=>{
      const out=T.mergeStores(JSON.parse(JSON.stringify(c.a)),JSON.parse(JSON.stringify(c.b)));
      eq(out.v,1,"v");
      for(const [p,want] of Object.entries(c.expect)) eq(resolve(out.progress,p),want,p);
    });
  for(const c of cases.contentHash)
    check("contentHash: "+c.name, ()=>{
      const h=T.contentHash(c.input);
      if(c.same) eq(T.contentHash(c.same),h,"same-hash");
      if(c.different && T.contentHash(c.different)===h) throw new Error("hashes should differ");
    });
  for(const c of cases.migrateStore)
    check("migrateStore: "+c.name, ()=>{
      const out=T.migrateStore(c.input===null?null:JSON.parse(JSON.stringify(c.input)));
      eq(out.v,c.expectV,"v");
      if(c.expectEmpty) eq(out.progress,{},"empty");
      if(c.expectPath) eq(resolve(out.progress,c.expectPath),c.expectValue,c.expectPath);
    });
  check("renderDiff escapes injected HTML", ()=>{
    const base={id:"t",title:"T",tier:"essential",learn:{summary:"safe",links:[]},do:["x"],children:[]};
    const evil=JSON.parse(JSON.stringify(base));
    evil.learn.summary='<img src=x onerror=alert(1)>';
    const out=T.renderDiff(base,evil);
    if(out.includes("<img")) throw new Error("unescaped <img> in diff output");
  });
  check("esc escapes all five characters", ()=>{
    eq(T.esc('<a b="c">&\''), "&lt;a b=&quot;c&quot;&gt;&amp;&#39;");
  });
  check("flatten preserves spine order", ()=>{
    eq(T.flatten({nodes:[{id:"a",children:[{id:"b"}]},{id:"c"}]}).map(n=>n.id),["a","b","c"]);
  });
  document.getElementById("summary").textContent=
    fail? `✗ ${fail} failing, ${pass} passing` : `✓ all ${pass} passing`;
});
</script>
</body>
</html>
