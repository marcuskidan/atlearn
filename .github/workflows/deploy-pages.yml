name: Deploy Pages
# Deterministic deploys: Pages source is set to "GitHub Actions" in repo
# settings, and this workflow is the only thing that publishes — invoked on
# every push to main and by the landing workflow after it commits content.
on:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    # Private repos can't publish Pages on the free plan — skip cleanly while
    # the repo soft-launches private; deploys start on the flip to public.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0   # full history: the vital-signs contributor tally reads it
      - name: Generate vital signs (repo data only — never committed)
        run: python3 tools/build.py --health
      - name: Assemble the site — app files only, not tools/tests/workflows
        run: |
          mkdir _site
          cp index.html config.js _site/
          cp -R roadmaps _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
