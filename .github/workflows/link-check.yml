name: Link check
# Weekly probe of every content URL. lychee does the crawling (retries,
# rate limits, UA handling); failures land in a single "link-rot" issue that
# is updated in place. 403/429 responses are treated as bot-blocking, not rot.
on:
  schedule:
    - cron: "0 6 * * 1"   # Mondays 06:00 UTC
  workflow_dispatch:

jobs:
  links:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - name: Probe every content URL
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --accept '200..=299,403,429' 'roadmaps/**/*.json'
          output: link-report.md
          fail: false
      - name: Find the open link-rot issue
        if: steps.lychee.outputs.exit_code != 0
        id: issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "number=$(gh issue list --label link-rot --state open --json number --jq '.[0].number')" >> "$GITHUB_OUTPUT"
      - name: File or update the link-rot issue
        if: steps.lychee.outputs.exit_code != 0
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: Link rot report
          content-filepath: link-report.md
          labels: link-rot
          issue-number: ${{ steps.issue.outputs.number }}
