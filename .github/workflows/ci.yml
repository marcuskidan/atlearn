name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  content:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate content + regenerate index
        run: python3 tools/build.py
      - name: Index freshness
        run: git diff --exit-code roadmaps/index.json roadmaps/search.json
      - name: Standalone bundle smoke
        run: python3 tools/build.py --standalone
      - name: Python tests
        run: python3 -m unittest discover -s tests -v

  js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Client logic tests
        run: node --test tests/

  rules:
    # firestore.rules is the entire server-side security boundary — test it
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: npm install --no-save firebase-tools @firebase/rules-unit-testing
      - run: npx firebase emulators:exec --only firestore --project demo-hkr
             "node --test tests/rules.test.mjs"
