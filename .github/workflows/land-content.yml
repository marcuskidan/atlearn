name: Land content
# Turns in-app merges (Firestore `merged` docs) into attributed commits on
# main, then redeploys Pages. The service-account secret lives here — the
# app itself never holds repo credentials.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: land-content
  cancel-in-progress: false

jobs:
  land:
    runs-on: ubuntu-latest
    outputs:
      landed: ${{ steps.land.outputs.landed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save firebase-admin
      - id: land
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          node tools/land.mjs
          echo "landed=$(cat .landed)" >> "$GITHUB_OUTPUT"

  deploy:
    needs: land
    if: needs.land.outputs.landed != '0'
    uses: ./.github/workflows/deploy-pages.yml
    permissions:
      contents: read
      pages: write
      id-token: write
